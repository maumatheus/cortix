<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Cortix</title>
<style>
  :root {
    --from: #00d4ff;
    --to: #00ffa3;
    --fundo: #07090c;
    --superficie: #10151d;
    --linha: rgba(255, 255, 255, 0.08);
    --texto: #ffffff;
    --texto-2: #8a929e;
  }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fundo);
    color: var(--texto);
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; -webkit-app-region: drag;
  }
  .halo {
    position: absolute; inset: -30% 20% auto 20%; height: 320px;
    background: radial-gradient(ellipse at center, rgba(0, 212, 255, 0.22), transparent 62%);
    filter: blur(8px); pointer-events: none;
  }
  .cartao {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 34px 40px;
  }
  .marca { width: 108px; height: auto; filter: drop-shadow(0 10px 30px rgba(0, 212, 255, 0.35)); }
  .nome { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.14em; margin: 0; }
  .tagline {
    font-size: 0.64rem; letter-spacing: 0.34em; color: var(--texto-2);
    text-transform: uppercase; margin: -14px 0 0;
  }
  .painel { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
  .estado { font-size: 0.85rem; color: var(--texto-2); text-align: center; min-height: 1.4em; }
  .estado b { color: var(--texto); font-weight: 600; }
  .barra {
    height: 6px; border-radius: 999px; background: var(--superficie);
    border: 1px solid var(--linha); overflow: hidden;
  }
  .barra > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--from), var(--to));
    border-radius: 999px; transition: width 0.25s ease;
  }
  .barra.indeterminada > i { width: 38%; animation: vaivem 1.15s ease-in-out infinite; }
  @keyframes vaivem { 0% { margin-left: -38%; } 100% { margin-left: 100%; } }
  .numeros { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--texto-2); }
  .numeros span:last-child { font-variant-numeric: tabular-nums; }
  .acoes { display: flex; gap: 10px; justify-content: center; }
  button {
    -webkit-app-region: no-drag; cursor: pointer; font: inherit; font-weight: 600;
    padding: 9px 20px; border-radius: 9px; border: 1px solid transparent; transition: filter 0.15s ease;
  }
  button:hover { filter: brightness(1.12); }
  .primario { background: linear-gradient(135deg, var(--from), var(--to)); color: #04222c; }
  .secundario { background: transparent; border-color: var(--linha); color: var(--texto-2); }
  .versao { position: absolute; bottom: 12px; font-size: 0.68rem; color: #4a5260; letter-spacing: 0.08em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="halo"></div>
  <div class="cartao">
    <img class="marca" id="marca" alt="Cortix" />
    <div style="text-align:center">
      <p class="nome">CORTIX</p>
      <p class="tagline">Ideias · Vídeos · Resultados</p>
    </div>

    <div class="painel">
      <div class="estado" id="estado">Iniciando…</div>
      <div class="barra indeterminada" id="barra"><i id="preenchimento"></i></div>
      <div class="numeros" id="numeros" hidden>
        <span id="detalhe"></span>
        <span id="pct">0%</span>
      </div>
      <div class="acoes" id="acoes" hidden>
        <button class="primario" id="btn-atualizar">Atualizar agora</button>
        <button class="secundario" id="btn-depois">Agora não</button>
      </div>
    </div>
  </div>
  <div class="versao" id="versao"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const barra = $("barra");
  const preenchimento = $("preenchimento");

  function indeterminado(on) {
    barra.classList.toggle("indeterminada", on);
    if (on) preenchimento.style.width = "";
    $("numeros").hidden = on;
  }

  function progresso(pct, detalhe) {
    indeterminado(false);
    const v = Math.max(0, Math.min(100, pct));
    preenchimento.style.width = v + "%";
    $("pct").textContent = v.toFixed(0) + "%";
    $("detalhe").textContent = detalhe || "";
  }

  window.cortix?.aoReceber((evt) => {
    switch (evt.tipo) {
      case "versao":
        $("versao").textContent = "versão " + evt.versao;
        break;
      case "marca":
        $("marca").src = evt.dataUri;
        break;
      case "estado":
        $("estado").innerHTML = evt.texto;
        if (evt.indeterminado !== false) indeterminado(true);
        break;
      case "progresso":
        if (evt.texto) $("estado").innerHTML = evt.texto;
        progresso(evt.pct, evt.detalhe);
        break;
      case "perguntar-atualizacao":
        indeterminado(false);
        preenchimento.style.width = "100%";
        $("numeros").hidden = true;
        $("estado").innerHTML = "Nova versão <b>" + evt.versao + "</b> disponível.";
        $("acoes").hidden = false;
        break;
      case "erro":
        indeterminado(false);
        preenchimento.style.width = "100%";
        $("estado").innerHTML = evt.texto;
        break;
    }
  });

  $("btn-atualizar").addEventListener("click", () => {
    $("acoes").hidden = true;
    window.cortix?.responder("atualizar");
  });
  $("btn-depois").addEventListener("click", () => {
    $("acoes").hidden = true;
    window.cortix?.responder("depois");
  });
</script>
</body>
</html>
